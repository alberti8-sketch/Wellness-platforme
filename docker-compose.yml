# Lancement local complet : ./start.sh (ou docker compose up --build)
# Le mot de passe de la base est lu dans le fichier .env à la racine (non versionné) :
# start.sh le crée automatiquement à partir de .env.example avec un mot de passe aléatoire.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wellness_db
      POSTGRES_USER: wellness_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env (voir .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness_user -d wellness_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      WELLNESS_DATABASE_URL: postgresql://wellness_user:${POSTGRES_PASSWORD}@postgres:5432/wellness_db
      WELLNESS_CORS_ORIGINS: http://localhost:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      UVICORN_EXTRA_ARGS: --reload
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/srv/backend
      - ./data:/srv/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
